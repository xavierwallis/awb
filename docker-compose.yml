services:
  awb:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      ROCKET_ADDRESS: '0.0.0.0'
      ROCKET_PORT: '8000'
      CHROME_PROFILE_DIR: '/app/chrome/profile'
    shm_size: '1gb'
    restart: unless-stopped
    volumes:
      - chrome_profile:/app/chrome/profile

volumes:
  chrome_profile:
